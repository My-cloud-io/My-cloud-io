<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cloud-Zen — Private Telegram Cloud</title>
<style>
:root{--bg:#05070d;--panel:#0b1020e8;--line:#27304a;--text:#edf2ff;--muted:#8791ac;--pink:#ff9bc9;--gold:#ffd78b;--cyan:#69f3ff;--red:#ff6b87}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#18213e 0,transparent 38%),radial-gradient(circle at 90% 20%,#2a1631 0,transparent 30%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#fff,transparent)}
main{width:min(1100px,94vw);margin:auto;padding:28px 0 60px}.brand{letter-spacing:.18em;font-weight:800;font-size:13px;color:var(--cyan)}h1{font-size:clamp(28px,6vw,54px);margin:8px 0;background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;color:transparent}.sub{color:var(--muted);margin-bottom:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 70px #0008;backdrop-filter:blur(18px);padding:18px;margin:14px 0}.login{max-width:500px;margin:12vh auto}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}input,button{border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:#080d19;color:var(--text);font:inherit}button{cursor:pointer}button.primary{border:0;background:linear-gradient(100deg,var(--pink),var(--gold));color:#16121a;font-weight:800}button.danger{color:#ffd8df;border-color:#5d2634}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:11px 13px;border:1px solid var(--line);border-radius:13px;color:var(--muted)}.stat b{color:var(--text)}.files{display:grid;gap:10px}.file{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px;border:1px solid #222a40;border-radius:16px;background:#080d18cc}.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions button{padding:9px 10px;font-size:12px}.hidden{color:var(--pink)}.progress{height:9px;border-radius:99px;background:#161c2c;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .15s}.status{margin-top:9px;color:var(--muted);font-size:13px;min-height:20px}.viewer{position:fixed;inset:0;background:#02040beF;z-index:5;display:none;padding:18px}.viewer.show{display:flex;flex-direction:column}.viewer iframe,.viewer video,.viewer audio,.viewer img{width:100%;height:calc(100vh - 75px);border:0;object-fit:contain;background:#000;border-radius:14px}.close{align-self:flex-end;margin-bottom:10px}.empty{text-align:center;padding:45px;color:var(--muted)}
@media(max-width:650px){main{padding-top:18px}.panel{border-radius:18px}.toolbar{grid-template-columns:1fr}.file{grid-template-columns:1fr}.actions{justify-content:flex-start}.actions button{flex:1}}
</style>
</head>
<body>
<main>
  <div class="brand">CZ / TELEGRAM STORAGE NODE</div>
  <h1>Cloud-Zen</h1>
  <div class="sub">Private cloud interface · Telegram-backed storage</div>

  <section id="login" class="panel login">
    <h2>Private Access</h2>
    <p class="sub">Sign in to manage your Telegram-backed files.</p>
    <div class="row"><input id="password" type="password" placeholder="Website password"><button class="primary" onclick="login()">ENTER</button></div>
    <div id="loginStatus" class="status"></div>
  </section>

  <section id="app" style="display:none">
    <div class="panel">
      <div class="row">
        <input id="fileInput" type="file" multiple>
        <button class="primary" onclick="uploadSelected()">UPLOAD TO TELEGRAM</button>
        <button onclick="logout()">LOG OUT</button>
      </div>
      <div id="uploadArea"></div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input id="search" placeholder="Search files, audio, video, documents..." oninput="loadFiles()">
        <div class="row" style="flex:0 0 auto"><button onclick="toggleHidden()" id="hiddenBtn">SHOW HIDDEN</button><button onclick="loadAll()">REFRESH</button></div>
      </div>
      <div class="stats" style="margin-top:12px"><div class="stat">Used <b id="used">—</b></div><div class="stat">Free <b id="free">—</b></div><div class="stat">Files <b id="count">—</b></div><div class="stat">Telegram <b id="tg">—</b></div></div>
    </div>

    <div class="panel"><div id="files" class="files"><div class="empty">Loading cloud index…</div></div></div>
  </section>
</main>

<div id="viewer" class="viewer"><button class="close" onclick="closeViewer()">CLOSE</button><div id="viewerBody" style="flex:1;min-height:0"></div></div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>{n=Number(n||0);const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt});const j=await r.json().catch(()=>({ok:false,error:'BAD_RESPONSE'}));if(!r.ok)throw new Error(j.error||'REQUEST_FAILED');return j}
async function login(){try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('login').style.display='none';$('app').style.display='block';await loadAll()}catch(e){$('loginStatus').textContent=e.message}}
async function logout(){await api('/api/auth/logout',{method:'POST'});location.reload()}
async function loadAll(){await Promise.all([loadFiles(),loadStorage(),health()])}
async function health(){try{const j=await fetch('/api/health').then(r=>r.json());$('tg').textContent=j.telegram?'ONLINE':'OFFLINE'}catch{$('tg').textContent='ERROR'}}
async function loadStorage(){try{const j=await api('/api/storage');$('used').textContent=fmt(j.used);$('free').textContent=fmt(j.free);$('count').textContent=j.count}catch(e){$('used').textContent='ERROR'}}
let showHidden=false;
function toggleHidden(){showHidden=!showHidden;$('hiddenBtn').textContent=showHidden?'HIDE HIDDEN':'SHOW HIDDEN';loadFiles()}
async function loadFiles(){try{const q=encodeURIComponent($('search').value||'');const j=await api('/api/files?q='+q+'&includeHidden='+(showHidden?'1':'0'));$('files').innerHTML=j.files.length?j.files.map(renderFile).join(''):'<div class="empty">No files found.</div>'}catch(e){$('files').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderFile(f){return `<div class="file"><div><div class="name">${esc(f.name)} ${f.hidden?'<span class="hidden">[HIDDEN]</span>':''}</div><div class="meta">${fmt(f.size)} · ${esc(f.mime||'file')} ${f.legacy?'· legacy Telegram file':''}</div></div><div class="actions"><button onclick="openFile('${f.id}','${esc(f.mime||'')}','${esc(f.name)}')">OPEN</button><button onclick="location.href='${f.downloadUrl}'">DOWNLOAD</button><button onclick="renameFile('${f.id}','${esc(f.name)}')">RENAME</button><button onclick="shareFile('${f.id}')">SHARE</button><button onclick="hideFile('${f.id}',${!f.hidden})">${f.hidden?'UNHIDE':'HIDE'}</button><button class="danger" onclick="deleteFile('${f.id}')">DELETE</button></div></div>`}
async function uploadSelected(){const files=[...$('fileInput').files];if(!files.length)return;for(const file of files)await uploadFile(file);await loadAll()}
async function uploadFile(file){const area=document.createElement('div');area.className='panel';area.innerHTML=`<b>${esc(file.name)}</b><div class="progress"><div class="bar"></div></div><div class="status">Starting…</div>`;$('uploadArea').prepend(area);const bar=area.querySelector('.bar'),status=area.querySelector('.status');try{const start=await api('/api/upload-start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:file.name,size:file.size,mime:file.type||'application/octet-stream'})});for(let i=0;i<start.total;i++){const blob=file.slice(i*start.chunkSize,Math.min(file.size,(i+1)*start.chunkSize));const b64=await toBase64(blob);const params=new URLSearchParams({fileId:start.fileId,index:i,total:start.total,size:file.size,mime:start.mime,name:start.name});await api('/api/upload-chunk?'+params,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:b64})});bar.style.width=Math.round(((i+1)/start.total)*100)+'%';status.textContent=`Uploading ${i+1}/${start.total} · ${Math.round(((i+1)/start.total)*100)}%`}await api('/api/upload-finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fileId:start.fileId})});status.textContent='Uploaded to Telegram ✓'}catch(e){status.textContent='Upload failed: '+e.message}}
function toBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)})}
async function renameFile(id,old){const name=prompt('New file name:',old);if(!name||name===old)return;try{await api('/api/files/'+encodeURIComponent(id)+'/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});await loadFiles()}catch(e){alert(e.message)}}
async function hideFile(id,hidden){try{await api('/api/files/'+encodeURIComponent(id)+'/hide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hidden})});await loadAll()}catch(e){alert(e.message)}}
async function shareFile(id){try{const j=await api('/api/files/'+encodeURIComponent(id)+'/share');const absolute=new URL(j.url,location.origin).href;if(navigator.clipboard)await navigator.clipboard.writeText(absolute);else prompt('Share link',absolute);alert('Share link copied. It expires in 24 hours.')}catch(e){alert(e.message)}}
async function deleteFile(id){const p=prompt('Enter DELETE_PASSWORD to permanently remove this Telegram data:');if(p===null)return;try{await api('/api/files/'+encodeURIComponent(id)+'/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});await loadAll()}catch(e){alert(e.message)}}
function openFile(id,mime,name){const v=$('viewer'),b=$('viewerBody');v.classList.add('show');const url='/api/files/'+encodeURIComponent(id)+'/open';if(mime.startsWith('image/'))b.innerHTML=`<img src="${url}" alt="">`;else if(mime.startsWith('video/'))b.innerHTML=`<video src="${url}" controls autoplay></video>`;else if(mime.startsWith('audio/'))b.innerHTML=`<audio src="${url}" controls autoplay></audio>`;else if(mime==='application/pdf'||mime.startsWith('text/'))b.innerHTML=`<iframe src="${url}" title="${esc(name)}"></iframe>`;else b.innerHTML=`<iframe src="${url}" title="${esc(name)}"></iframe>`}
function closeViewer(){$('viewer').classList.remove('show');$('viewerBody').innerHTML=''}
(async()=>{try{const j=await api('/api/auth/me');if(j.ok){$('login').style.display='none';$('app').style.display='block';loadAll()}}catch{}})();
</script>
</body>
</html>
