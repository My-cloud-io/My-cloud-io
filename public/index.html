<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Personal Cloud - Private Access</title>
<style>
:root{--bg:#06111f;--card:#0d1c2e;--line:#203651;--text:#eef5ff;--muted:#8da2b9;--accent:#ffc4b8;--accent2:#ffe18a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#163450 0,#06111f 40%,#030914 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 60px}.glass{background:#0b1a2acc;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 60px #0005;backdrop-filter:blur(14px)}.login{min-height:100vh;display:grid;place-items:center}.loginCard{width:min(100%,520px);padding:34px;text-align:center}.logo{width:72px;height:72px;margin:auto;border:1px solid #5b7793;border-radius:22px;display:grid;place-items:center;background:#14314a;font-size:34px}.title{font-size:28px;font-weight:800;margin:18px 0 8px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:transparent;background-clip:text}.muted{color:var(--muted)}input,button{font:inherit}input[type=password],input[type=text]{width:100%;padding:15px 16px;border-radius:14px;border:1px solid #52708b;background:#071827;color:#fff;outline:none}button{border:0;border-radius:13px;padding:12px 16px;color:#07111d;background:linear-gradient(100deg,var(--accent),var(--accent2));font-weight:800;cursor:pointer}.login button{width:100%;margin-top:12px}.error{color:#ff9eae;min-height:24px;margin-top:12px}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-size:20px;font-weight:800}.small{font-size:12px;color:#8fe4bd}.topActions{display:flex;gap:8px}.topActions button{padding:9px 12px}.stat{padding:18px;margin-bottom:12px}.statTop{display:flex;justify-content:space-between;align-items:end}.big{font-size:25px;font-weight:800}.bar{height:9px;background:#081321;border-radius:20px;overflow:hidden;margin:13px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#ffb7b8,#ffe68b);transition:width .25s}.tools{padding:12px;display:flex;gap:8px;margin-bottom:12px}.tools input{flex:1}.upload{padding:28px;text-align:center;border:1px dashed #47637e;margin-bottom:12px}.upload input{display:none}.files{padding:14px}.file{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #1d3148}.file:last-child{border-bottom:0}.icon{width:42px;height:42px;border-radius:13px;background:#142b43;display:grid;place-items:center}.info{min-width:0;flex:1}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px 9px;font-size:12px}.danger{background:#3b1722;color:#ffb2bd;border:1px solid #6d2c3b}.status{font-size:12px;color:#9fb2c8;text-align:center;padding:14px}.viewer{position:fixed;inset:0;background:#020710ee;z-index:5;padding:18px;display:flex;flex-direction:column}.viewerTop{display:flex;justify-content:space-between;align-items:center}.viewer iframe,.viewer video,.viewer audio,.viewer img{width:100%;height:calc(100vh - 90px);margin-top:12px;border:0;object-fit:contain}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14283d;border:1px solid #3c5871;padding:12px 16px;border-radius:14px;display:none;z-index:9}.toast.show{display:block}@media(max-width:600px){.wrap{padding:12px 10px 40px}.loginCard{padding:24px 18px}.file{align-items:flex-start}.tools{flex-direction:column}.top{align-items:flex-start}}
</style></head>
<body>
<div id="login" class="login"><div class="loginCard glass"><div class="logo">✦</div><div class="title">Private Access</div><div class="muted">Enter your password to continue.</div><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Password" style="margin-top:22px"><button>Enter Website</button></form><div id="loginError" class="error"></div></div></div>
<main id="app" class="wrap hidden"><div class="top"><div><div class="brand">☁ My Personal Cloud</div><div class="small">● Telegram storage online</div></div><div class="topActions"><button id="refresh">Refresh</button><button id="logout">Logout</button></div></div>
<section class="stat glass"><div class="statTop"><div><div class="muted" style="font-size:11px;letter-spacing:2px">CLOUD STORAGE</div><div id="used" class="big">0 B / 10 GB</div></div><div id="percent" class="big">0%</div></div><div class="bar"><div id="fill" class="fill"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)"><span id="usedText">Used: 0 B</span><span id="freeText">Free: 10 GB</span></div></section>
<section class="tools glass"><input id="search" type="text" placeholder="Search your personal cloud..."><button id="searchBtn">Search</button></section>
<section class="upload glass"><input id="fileInput" type="file" multiple><button id="choose">＋ Select Files</button><div class="muted" style="margin-top:12px;font-size:12px">Videos • 4K • Documents • Images • Audio • Recordings • All files</div></section>
<section class="files glass"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:6px 0 12px">Your Files</h3><span id="count" class="muted">0 files</span></div><div id="list"></div><div id="status" class="status">Loading...</div></section></main>
<div id="viewer" class="viewer hidden"><div class="viewerTop"><b id="viewerTitle">Preview</b><button id="closeViewer">Close</button></div><div id="viewerBody"></div></div><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);let files=[];const CHUNK=4*1024*1024;
function toast(s){const t=$("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",...opt});let d=null;try{d=await r.json()}catch{}if(r.status===401){showLogin();throw Error("Authentication required")}if(!r.ok)throw Error(d?.detail||d?.error||"Request failed");return d}
function showLogin(){$("login").classList.remove("hidden");$("app").classList.add("hidden")}
function showApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden");loadAll()}
function fmt(n){n=Number(n)||0;if(n<1024)return n+" B";const u=["KB","MB","GB","TB"];let i=Math.min(u.length-1,Math.floor(Math.log(n)/Math.log(1024))-1);return (n/1024**(i+1)).toFixed(i?2:0)+" "+u[i]}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
async function loadStorage(){const d=await api("/api/storage");$("used").textContent=`${d.usedText} / ${d.limitText}`;$("percent").textContent=d.usedPercent+"%";$("fill").style.width=Math.min(100,d.usedPercent)+"%";$("usedText").textContent="Used: "+d.usedText;$("freeText").textContent="Free: "+d.remainingText}
async function loadFiles(){const q=$("search").value.trim();files=await api("/api/files"+(q?"?q="+encodeURIComponent(q):""));render()}
function render(){const list=$("list");$("count").textContent=files.length+" file"+(files.length===1?"":"s");$("status").textContent=files.length?"":"No files found";list.innerHTML="";files.forEach(f=>{const row=document.createElement("div");row.className="file";row.innerHTML=`<div class="icon">${f.mime?.startsWith("video/")?"▶":f.mime?.startsWith("audio/")?"♫":f.mime?.startsWith("image/")?"▧":"▤"}</div><div class="info"><div class="name" title="${esc(f.name)}">${esc(f.name)}</div><div class="meta">${fmt(f.size)} • ${esc(f.mime||"file")}</div></div><div class="actions"><button data-open="${esc(f.id)}">Open</button><button data-down="${esc(f.id)}">Download</button><button data-ren="${esc(f.id)}">Rename</button><button class="danger" data-del="${esc(f.id)}">Delete</button></div></div>`;list.appendChild(row)})}
function contentUrl(id,download=false){return "/api/files/"+encodeURIComponent(id)+"/content"+(download?"?download=1":"")}
function openFile(f){const v=$("viewer"),b=$("viewerBody");$("viewerTitle").textContent=f.name;b.innerHTML="";const url=contentUrl(f.id);if(f.mime?.startsWith("image/"))b.innerHTML=`<img src="${url}" alt="">`;else if(f.mime?.startsWith("video/"))b.innerHTML=`<video src="${url}" controls autoplay></video>`;else if(f.mime?.startsWith("audio/"))b.innerHTML=`<audio src="${url}" controls autoplay style="margin-top:30px;width:100%"></audio>`;else if(f.mime==="application/pdf")b.innerHTML=`<iframe src="${url}"></iframe>`;else{window.open(contentUrl(f.id,true),"_blank");return}v.classList.remove("hidden")}
async function upload(file){const fid=crypto.randomUUID();const total=Math.ceil(file.size/CHUNK);const row=document.createElement("div");row.className="file";row.innerHTML=`<div class="icon">↑</div><div class="info"><div class="name">${esc(file.name)}</div><div class="meta" id="p-${fid}">Uploading 0%</div><div class="bar"><div id="b-${fid}" class="fill"></div></div></div>`;$("list").prepend(row);for(let i=0;i<total;i++){const blob=file.slice(i*CHUNK,Math.min(file.size,(i+1)*CHUNK));await new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open("POST","/api/upload-chunk");x.withCredentials=true;x.setRequestHeader("Content-Type","application/octet-stream");x.setRequestHeader("X-File-Id",fid);x.setRequestHeader("X-Chunk-Index",i);x.setRequestHeader("X-Total-Chunks",total);x.setRequestHeader("X-File-Name",file.name);x.setRequestHeader("X-File-Size",file.size);x.setRequestHeader("X-File-Mime",file.type||"application/octet-stream");x.upload.onprogress=e=>{if(e.lengthComputable){const p=((i*CHUNK+e.loaded)/file.size*100);$("p-"+fid).textContent="Uploading "+Math.floor(p)+"%";$("b-"+fid).style.width=p+"%"}};x.onload=()=>x.status>=200&&x.status<300?resolve():reject(Error("Upload failed: "+x.responseText));x.onerror=()=>reject(Error("Network error"));x.send(blob)})}toast(file.name+" uploaded");await loadAll()}
async function loadAll(){try{$("status").textContent="Loading your cloud...";await loadStorage();await loadFiles()}catch(e){$("status").textContent=e.message}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").textContent="";try{await api("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});showApp()}catch(e){$("loginError").textContent=e.message}};
$("choose").onclick=()=>$("fileInput").click();$("fileInput").onchange=async e=>{for(const f of e.target.files){try{await upload(f)}catch(err){toast(err.message)}}e.target.value=""};$("refresh").onclick=loadAll;$("searchBtn").onclick=loadFiles;$("search").onkeydown=e=>{if(e.key==="Enter")loadFiles()};$("logout").onclick=async()=>{await api("/api/auth/logout",{method:"POST"});showLogin()};$("closeViewer").onclick=()=>$("viewer").classList.add("hidden");$("list").onclick=async e=>{const b=e.target;if(!(b instanceof HTMLButtonElement))return;const f=files.find(x=>x.id===(b.dataset.open||b.dataset.down||b.dataset.ren||b.dataset.del));if(!f)return;if(b.dataset.open)return openFile(f);if(b.dataset.down){const a=document.createElement("a");a.href=contentUrl(f.id,true);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}if(b.dataset.ren){const n=prompt("New file name",f.name);if(n)try{await api(`/api/files/${encodeURIComponent(f.id)}/rename`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n})});await loadAll()}catch(err){toast(err.message)}}if(b.dataset.del){const p=prompt("Delete password");if(p)try{await api(`/api/files/${encodeURIComponent(f.id)}`,{method:"DELETE",headers:{"Content-Type":"application/json","X-Delete-Password":p},body:JSON.stringify({password:p})});await loadAll()}catch(err){toast(err.message)}}};
(async()=>{try{const d=await api("/api/auth/me");if(d.authenticated)showApp();else showLogin()}catch{showLogin()}})();
</script></body></html>
